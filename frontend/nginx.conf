server{
  listen 80;
  root /usr/share/nginx/html;
  index index.html;


 location ~ ^/api/products/[0-9]+/(reserve|release)$ {
        return 403;
    }

  

  location /api/orders/ {
    proxy_pass http://orders:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

}
  location /api/ {
    proxy_pass http://products:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

 }

 location / {
    try_files $uri $uri/ /index.html;

    }

}
