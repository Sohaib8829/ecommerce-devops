<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopStack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🛍️ ShopStack</div>
    <input id="search" type="search" placeholder="Search coming soon..." disabled>
    <div class="cart">🛒 <span id="cart-count">0</span></div>
  </header>

  <main>
    <section class="hero">
      <h1>Apni dukan, ab 24 ghante online</h1>
      <p>Behtareen products, sahi daam par</p>
    </section>

    <div id="filters" class="filters"></div>
    <div id="status" class="status">Products load ho rahe hain...</div>
    <div id="grid" class="grid"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
