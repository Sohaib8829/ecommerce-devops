name: CI
  
on: 
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker compose file
        run: docker compose config -q

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/products, services/orders,frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Builid ${{matrix.service}}
        run: docker build -t test-image ${{matrix.service}}
    
  test-job:
    runs-on: ubuntu-latest
    needs: [validate-compose , build-images]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [["${{contains(needs.*.result,'failure')}}" == "true" || "${{contains(needs.*.result,'cancelled')}}" == "true"]]; then
            echo "One or more required jobs were failed or cancelled"
            exit 1
          fi
          echo "All required checks passed"