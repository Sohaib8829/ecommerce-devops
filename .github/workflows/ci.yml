name: CI
  
on: 
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate docker compose file
        run: docker compose config -q

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [services/products, services/orders,frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Builid ${{matrix.service}}
        run: docker build -t test-image ${{matrix.service}}
   
  smoke-test:
    runs-on: ubuntu-latest
    needs: [validate-compose , build-images]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bring up all stack
        run: docker compose up -d --build --wait --wait-timeout 100
        
      - name: Run smoke test
        run: bash scripts/smoke-test.sh

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
        
  ci-gate:
    runs-on: ubuntu-latest
    needs: [validate-compose , build-images , smoke-test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{contains(needs.*.result,'failure')}}" == "true" || "${{contains(needs.*.result,'cancelled')}}" == "true" ]]; then
            echo "One or more required jobs were failed or cancelled"
            exit 1
          fi
          echo "All required checks passed"